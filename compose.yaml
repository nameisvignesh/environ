services:
  environ:
    build: .
    image: environ:dev
    container_name: environ-desktop
    init: true
    shm_size: 1gb
    ports:
      - "127.0.0.1:6080:6080"
    environment:
      ENVIRON_WORKSPACE: /workspace
    volumes:
      - "${ENVIRON_WORKSPACE:-.}:/workspace"
    restart: unless-stopped
