name: Environ

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check Rust application
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Type and test check
        run: cargo test --all-targets

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  release:
    name: Build ${{ matrix.name }}
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            archive: zip
          - name: linux-x64
            os: ubuntu-latest
            archive: tar.gz
          - name: macos-arm64
            os: macos-14
            archive: tar.gz
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo version
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          test "$TAG" = "$VERSION" || { echo "Expected $VERSION but got $TAG"; exit 1; }

      - name: Build release binary
        run: cargo build --release

      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item target/release/environ.exe release/Environ-${{ github.ref_name }}-${{ matrix.name }}.exe
          Compress-Archive -Path target/release/environ.exe -DestinationPath release/Environ-${{ github.ref_name }}-${{ matrix.name }}.zip

      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          mkdir -p release/Environ-${{ github.ref_name }}-${{ matrix.name }}
          cp target/release/environ release/Environ-${{ github.ref_name }}-${{ matrix.name }}/environ
          tar -czf release/Environ-${{ github.ref_name }}-${{ matrix.name }}.tar.gz -C release Environ-${{ github.ref_name }}-${{ matrix.name }}
          rm -rf release/Environ-${{ github.ref_name }}-${{ matrix.name }}

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: Environ-${{ github.ref_name }}-${{ matrix.name }}
          path: release/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: Environ-*
          merge-multiple: true

      - name: Generate checksums
        working-directory: release
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Environ ${{ github.ref_name }}
          generate_release_notes: true
          files: release/*
